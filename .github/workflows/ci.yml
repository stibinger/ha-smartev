# Continuous Integration workflow

name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install requests ruff
          if [ -f requirements.txt ]; then
            python -m pip install -r requirements.txt
          fi

      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python files
        run: python -m compileall custom_components tests

      - name: Ruff
        run: python -m ruff check --isolated --select E4,E7,E9,F,I custom_components tests

      - name: Validate Home Assistant translations
        run: |
          for file in custom_components/*/translations/*.json; do
            python -m json.tool "$file" > /dev/null
          done

      - name: Check whitespace errors
        run: git diff --check
